[package]
edition = "2024"
name = "firmware"
version = "0.1.0"

[dependencies]
cortex-m = { version = "0.7.7", features = [
    "inline-asm",
    "critical-section-single-core",
] }
cortex-m-rt = "0.7.5"
defmt = { version = "1.0.1" }
defmt-rtt-pipe = { path = "../../Rust_Monorepo/defmt-rtt-pipe" }
embassy-executor = { git = "https://github.com/embassy-rs/embassy.git", features = [
    "platform-cortex-m",
    "executor-thread",
    "executor-interrupt",
    "nightly",
] }
embassy-futures = { git = "https://github.com/embassy-rs/embassy.git" }
embassy-stm32 = { git = "https://github.com/embassy-rs/embassy.git", features = [
    "stm32h743vi",
    "time-driver-any",
    "exti",
    "unstable-pac",
    "defmt",
] }
embassy-sync = { git = "https://github.com/embassy-rs/embassy.git" }
embassy-time = { git = "https://github.com/embassy-rs/embassy.git", features = [
    "tick-hz-1_000_000",
    "defmt",
    "defmt-timestamp-uptime",
] }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
firmware-common-new = { path = "../../Rust_Monorepo/firmware-common-new", default-features = false, features = [
    "defmt",
] }
air-brakes-controller-core = { path = "../../Rust_Monorepo/air-brakes-controller-core", default-features = false, features = [
    "defmt",
] }
embedded-io-async = "0.7.0"
embedded-hal-async = { version = "1.0.0", features = ["defmt-03"] }
embassy-embedded-hal = { git = "https://github.com/embassy-rs/embassy.git" }
stm32-device-signature = { version = "0.3.3", features = ["stm32h74x"] }
embedded-can = "0.4.1"
crc = "3.2.1"
libm = "0.2.7"
heapless = { version = "0.8.0", features = ["serde"], default-features = false }
lora-phy = { git = "https://github.com/lora-rs/lora-rs.git", default-features = false, features = [
    "defmt-03",
] }
embedded-sdmmc = { version = "0.8.1", default-features = false, features = [
    "defmt-log",
] }
biquad = "0.5.0"
binary_macros = { git = "https://github.com/PegasisForever/binary_macros.git" }
nalgebra = { version = "0.34.0", default-features = false, features = [
    "libm-force",
    "serde-serialize-no-std",
    "defmt",
] }
micromath = "2.1.0"
embassy-usb = { git = "https://github.com/embassy-rs/embassy.git", features = [
    "defmt",
] }
rkyv = { version = "0.8.10", default-features = false, features = [
    "pointer_width_32",
] }

icao-isa = { version = "1.1.0", optional = true }
icao-units = { version = "1.1.0", optional = true }

[features]
default = []
# Base HIL infrastructure: simulate ONLY the barometer; IMU/GPS/pyro/mag/CAN/SD/LoRa are
# all real and the board boots into SelfTest. Prefer hil-dual or hil-single.
hil-replay = ["dep:icao-isa", "dep:icao-units"]
# Dual-deploy HIL: replays the real Osiris OpenRocket trajectory against the
# real FLIGHT_CONFIG, and boots straight into Armed so no ground station is
# needed. ~8 minutes of wall clock, ending in a landed detection.
#   cargo run --bin main --features hil-dual
hil-dual = ["hil-replay", "boot-armed"]
# Single-deploy HIL plot (drogue then main back-to-back at apogee).
#   cargo run --bin main --features hil-single
hil-single = ["hil-replay"]
# Boot straight into Armed instead of SelfTest, for a bench with no ground
# station. HIL-only — see the compile_error in main.rs. The pyro task drives
# real GPIO, so a boot-armed board fires both channels unattended.
boot-armed = []

[patch.crates-io]
embassy-sync = { git = "https://github.com/embassy-rs/embassy.git" }


[[bin]]
name = "main"
path = "src/main.rs"
test = false
bench = false

[[bin]]
name = "gcm"
path = "src/main_gcm.rs"
test = false
bench = false

# Testing Entry Points

[[bin]]
name = "sd_test"
path = "src/main_sd_test.rs"
test = false
bench = false

# Baro noise-characterization bench (streams raw MS5607 over RTT; not flight fw).
[[bin]]
name = "baro_bench"
path = "src/main_baro_bench.rs"
test = false
bench = false

# IMU noise-characterization bench (windowed LSM6DSM stats over RTT; not flight fw).
[[bin]]
name = "imu_bench"
path = "src/main_imu_bench.rs"
test = false
bench = false

[profile.dev]
debug = true
lto = true
opt-level = "z"
incremental = true

[profile.release]
debug = false
lto = true
opt-level = "z"
incremental = true
