[package]
edition = "2024"
name = "firmware"
version = "0.1.0"

[dependencies]
cortex-m = { version = "0.7.7", features = [
    "inline-asm",
    "critical-section-single-core",
] }
cortex-m-rt = "0.7.5"
defmt = { version = "1.0.1" }
defmt-rtt-pipe = { path = "../../Rust_Monorepo/defmt-rtt-pipe" }
embassy-executor = { git = "https://github.com/embassy-rs/embassy.git", features = [
    "arch-cortex-m",
    "executor-thread",
    "executor-interrupt",
    "nightly",
] }
embassy-futures = { git = "https://github.com/embassy-rs/embassy.git" }
embassy-stm32 = { git = "https://github.com/embassy-rs/embassy.git", features = [
    "stm32h743vi",
    "time-driver-any",
    "exti",
    "unstable-pac",
    "defmt",
] }
embassy-sync = { git = "https://github.com/embassy-rs/embassy.git" }
embassy-time = { git = "https://github.com/embassy-rs/embassy.git", features = [
    "tick-hz-1_000_000",
    "defmt",
    "defmt-timestamp-uptime",
] }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
firmware-common-new = { path = "../../Rust_Monorepo/firmware-common-new", default-features = false, features = [
    "defmt",
] }
air-brakes-controller-core = { path = "../../Rust_Monorepo/air-brakes-controller-core", default-features = false, features = [
    "defmt",
] }
embedded-io-async = "0.6.1"
embedded-hal-async = { version = "1.0.0", features = ["defmt-03"] }
embassy-embedded-hal = { git = "https://github.com/embassy-rs/embassy.git" }
stm32-device-signature = { version = "0.3.3", features = ["stm32h74x"] }
embedded-can = "0.4.1"
crc = "3.2.1"
heapless = { version = "0.8.0", features = ["serde"], default-features = false }
lora-phy = { git = "https://github.com/lora-rs/lora-rs.git", default-features = false, features = [
    "defmt-03",
] }
embedded-sdmmc = { version = "0.8.1", default-features = false, features = [
    "defmt-log",
] }
biquad = "0.5.0"
binary_macros = { git = "https://github.com/PegasisForever/binary_macros.git" }
nalgebra = { version = "0.34.0", default-features = false, features = [
    "libm-force",
    "serde-serialize-no-std",
    "defmt",
] }
micromath = "2.1.0"
embassy-usb = { git = "https://github.com/embassy-rs/embassy.git", features = [
    "defmt",
] }
rkyv = { version = "0.8.10", default-features = false, features = [
    "pointer_width_32",
] }

# Local embassy copy with H7 SDMMC IDMA fix (DBCKEND never fires, embassy #4723).
# Populate with: git clone --depth 1 https://github.com/embassy-rs/embassy.git vendor/embassy
# then apply the complete_datapath_transfer fix in embassy-stm32/src/sdmmc/mod.rs.
[patch.crates-io]
embassy-sync = { path = "vendor/embassy/embassy-sync" }

[patch."https://github.com/embassy-rs/embassy.git"]
embassy-embedded-hal = { path = "vendor/embassy/embassy-embedded-hal" }
embassy-executor = { path = "vendor/embassy/embassy-executor" }
embassy-executor-macros = { path = "vendor/embassy/embassy-executor-macros" }
embassy-futures = { path = "vendor/embassy/embassy-futures" }
embassy-hal-internal = { path = "vendor/embassy/embassy-hal-internal" }
embassy-stm32 = { path = "vendor/embassy/embassy-stm32" }
embassy-sync = { path = "vendor/embassy/embassy-sync" }
embassy-time = { path = "vendor/embassy/embassy-time" }
embassy-time-driver = { path = "vendor/embassy/embassy-time-driver" }
embassy-time-queue-utils = { path = "vendor/embassy/embassy-time-queue-utils" }
embassy-usb = { path = "vendor/embassy/embassy-usb" }
embassy-usb-driver = { path = "vendor/embassy/embassy-usb-driver" }
embassy-usb-synopsys-otg = { path = "vendor/embassy/embassy-usb-synopsys-otg" }


[[bin]]
name = "main"
path = "src/main.rs"
test = false
bench = false

[[bin]]
name = "gcm"
path = "src/main_gcm.rs"
test = false
bench = false

# Testing Entry Points

[[bin]]
name = "sd_test"
path = "src/main_sd_test.rs"
test = false
bench = false

[profile.dev]
debug = true
lto = true
opt-level = "z"
incremental = true

[profile.release]
debug = false
lto = true
opt-level = "z"
incremental = true
